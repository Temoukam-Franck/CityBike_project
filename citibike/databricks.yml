# This is a Declarative Automation Bundle definition for citibike.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: city_bycicle
  uuid: 0b4c8969-a567-4110-9eb4-7973f76bbed5

include:
  - resources/*.yml

variables:
  catalog:
    default: "citybike_dev"

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-26ed86fb-114b.cloud.databricks.com

  test_d:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    variables:
      catalog:
        default: "citybike_test"
    workspace:
      host: https://dbc-26ed86fb-114b.cloud.databricks.com
      root_path: ~/Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    presets:
      name_prefix: "[test]temoukamfranck"
    
  
  prod_:
    mode: production
    variables:
      catalog:
        default: "citybike_prod"
    workspace:
      host: https://dbc-26ed86fb-114b.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/temoukamfranck@yahoo.fr to make sure we only have a single copy.
      root_path: /Workspace/Users/temoukamfranck@yahoo.fr/.bundle/${bundle.name}/${bundle.target}

    permissions:
      - user_name: temoukamfranck@yahoo.fr
        level: CAN_MANAGE
